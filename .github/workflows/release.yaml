name: Release

on:
    release:
        types: [published]

    workflow_dispatch:

concurrency:
    group: release-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - name: Checkout the current branch
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

            - name: Setup of Python 3
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
              with:
                  python-version: "3.11"

            - name: Install Ansible dependencies
              run: python -m pip install --disable-pip-version-check --requirement requirements-release.txt

            - name: Release the Ansible role
              env:
                  ANSIBLE_GALAXY_API_KEY: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  owner="${REPOSITORY%%/*}"
                  repository="${REPOSITORY#*/}"
                  ansible-galaxy role import --api-key "${ANSIBLE_GALAXY_API_KEY}" "${owner}" "${repository}"

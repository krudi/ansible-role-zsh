---
- name: Verify
  hosts: all
  tasks:
    - name: Check zsh binary is available
      ansible.builtin.command: zsh --version
      register: zsh_version
      changed_when: false

    - name: Check Oh My Zsh directory exists
      ansible.builtin.stat:
        path: /home/bob/.oh-my-zsh
      register: omz_dir

    - name: Check .zshrc exists
      ansible.builtin.stat:
        path: /home/bob/.zshrc
      register: zshrc_file

    - name: Read the user's login shell
      ansible.builtin.getent:
        database: passwd
        key: bob

    - name: Assert user config exists
      ansible.builtin.assert:
        that:
          - omz_dir.stat.exists
          - zshrc_file.stat.exists
          - ansible_facts.getent_passwd['bob'][5] == '/bin/zsh'
